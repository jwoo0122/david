name: Validate direct default

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: rustfmt --edition 2024 --check src/main.rs src/backend.rs tests/direct_run.rs
      - run: cargo test --all-targets -- --skip tmux_backend_delivers_prompt_to_the_managed_agent_pane
      - run: cargo clippy --all-targets -- -D warnings
